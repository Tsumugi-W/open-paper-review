id: "ijcai/main/2026/v1"
conferenceId: "ijcai"
track: "main"
year: 2026
version: 1
status: "rubric_only"

scoreScale:
  min: -3
  max: 3
  step: 1
  labels:
    -3: "Strong reject"
    -2: "Reject"
    -1: "Weak reject"
    0: "Borderline"
    1: "Weak accept"
    2: "Accept"
    3: "Strong accept"

reviewSections:
  - id: "summary"
    title: "Summary"
    required: true
    description: "Summarize the paper, including the problem studied, the approach, and the main results."
    maxLength: 3000

  - id: "strengths"
    title: "Strengths"
    required: true
    description: "Describe the strengths of the paper in terms of technical quality, novelty, significance, and relevance to the broad AI community."
    maxLength: 5000

  - id: "weaknesses"
    title: "Weaknesses"
    required: true
    description: "Describe the weaknesses. Be specific and constructive."
    maxLength: 5000

  - id: "questions"
    title: "Questions for Authors"
    required: true
    description: "Questions for the authors to address in the author response."
    maxLength: 3000

  - id: "detailed_comments"
    title: "Detailed Comments"
    required: true
    description: "Provide detailed comments on the paper including suggestions for improvement, missing references, or technical issues."
    maxLength: 5000

  - id: "relevance"
    title: "Relevance to IJCAI"
    required: true
    description: "Assess how relevant the paper is to the broad AI community that IJCAI serves."
    maxLength: 2000

  - id: "confidence"
    title: "Confidence"
    required: true
    description: "Rate your confidence in your review from 1 (low) to 5 (expert)."

precheckRules:
  - id: "page_limit"
    type: "hard_stop"
    condition: "Paper body exceeds 7 pages (excluding references, which are limited to 1 additional page)"
    message: "IJCAI papers are limited to 7 pages of content plus 1 page for references only (strict 7+1 format)."

  - id: "anonymization"
    type: "hard_stop"
    condition: "Paper is not properly anonymized for double-blind review"
    message: "IJCAI uses double-blind review. The paper must not reveal author identities."

  - id: "formatting"
    type: "needs_confirmation"
    condition: "Paper does not use the official IJCAI LaTeX template"
    message: "Papers must use the official IJCAI 2026 formatting guidelines."

  - id: "dual_submission"
    type: "hard_stop"
    condition: "Paper is under review or has been published at another venue"
    message: "IJCAI does not accept papers currently under review or previously published at other venues."

  - id: "broad_ai_relevance"
    type: "needs_confirmation"
    condition: "Paper is narrowly focused on a single sub-area without discussing broader AI implications"
    message: "IJCAI is a general AI conference. Papers should discuss relevance beyond a narrow sub-field."

calibration:
  status: "rubric_only"

source:
  url: "https://ijcai-26.org/call-for-papers/"
  accessDate: "2026-01-15"
  maintainerNote: "Based on IJCAI 2024/2025 review criteria. IJCAI uses -3 to +3 scale. Strict 7+1 page format."
