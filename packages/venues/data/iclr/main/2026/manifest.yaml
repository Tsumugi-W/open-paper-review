id: "iclr/main/2026/v1"
conferenceId: "iclr"
track: "main"
year: 2026
version: 1
status: "rubric_only"

scoreScale:
  min: 1
  max: 10
  step: 1
  labels:
    1: "Trivial or wrong"
    3: "Clear reject"
    5: "Marginally below acceptance threshold"
    6: "Marginally above acceptance threshold"
    8: "Clear accept"
    10: "Top 5% of accepted papers, seminal paper"

reviewSections:
  - id: "summary"
    title: "Summary"
    required: true
    description: "Briefly summarize the paper and its contributions. This is not the place to critique the paper; the authors should generally agree with a well-written summary."
    maxLength: 3000

  - id: "strengths"
    title: "Strengths"
    required: true
    description: "A substantive assessment of the strengths of the paper, touching on each of the following dimensions: originality, quality, clarity, and significance."
    maxLength: 5000

  - id: "weaknesses"
    title: "Weaknesses"
    required: true
    description: "A substantive assessment of the weaknesses of the paper. Focus on constructive and actionable insights."
    maxLength: 5000

  - id: "questions"
    title: "Questions"
    required: true
    description: "Questions for the authors to address during the discussion period. Think of things where a response from the author could change your assessment."
    maxLength: 3000

  - id: "limitations"
    title: "Limitations"
    required: true
    description: "Have the authors adequately addressed the limitations and potential negative societal impact of their work?"
    maxLength: 2000

  - id: "ethical_concerns"
    title: "Ethical Concerns"
    required: false
    description: "If there are ethical issues with this paper, please flag them here."
    maxLength: 2000

  - id: "soundness"
    title: "Soundness"
    required: true
    description: "Rate the technical soundness of the paper on a scale from 1 (poor) to 4 (excellent)."

  - id: "presentation"
    title: "Presentation"
    required: true
    description: "Rate the clarity and presentation quality on a scale from 1 (poor) to 4 (excellent)."

  - id: "contribution"
    title: "Contribution"
    required: true
    description: "Rate the significance of the contribution on a scale from 1 (poor) to 4 (excellent)."

  - id: "confidence"
    title: "Confidence"
    required: true
    description: "Rate your confidence in your assessment from 1 (low) to 5 (high)."

precheckRules:
  - id: "page_limit"
    type: "hard_stop"
    condition: "Paper body exceeds 10 pages (excluding references and appendix)"
    message: "ICLR main track papers must be at most 10 pages for the main body, with unlimited additional pages for references and appendix."

  - id: "anonymization"
    type: "hard_stop"
    condition: "Paper is not properly anonymized for double-blind review"
    message: "ICLR uses double-blind review. The paper must not reveal author identities."

  - id: "formatting"
    type: "needs_confirmation"
    condition: "Paper does not use the official ICLR LaTeX template"
    message: "Papers should use the official ICLR 2026 LaTeX style file."

  - id: "dual_submission"
    type: "hard_stop"
    condition: "Paper appears to be a dual submission or previously published"
    message: "ICLR does not accept dual submissions or previously published work."

calibration:
  status: "rubric_only"

source:
  url: "https://iclr.cc/Conferences/2026/AuthorGuide"
  accessDate: "2026-01-15"
  maintainerNote: "Based on ICLR 2025/2026 review guidelines. Score scale and review form consistent with recent years."
