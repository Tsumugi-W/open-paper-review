id: "emnlp/main/2026/v1"
conferenceId: "emnlp"
track: "main"
year: 2026
version: 1
status: "rubric_only"

scoreScale:
  min: 1
  max: 5
  step: 0.5
  labels:
    1: "Poor - trivial, wrong, or already known"
    1.5: "Below average"
    2: "Mediocre - significant flaws or limited novelty"
    2.5: "Borderline"
    3: "Borderline - acceptable with revisions"
    3.5: "Above average"
    4: "Good - solid contribution"
    4.5: "Very good"
    5: "Excellent - groundbreaking contribution"

reviewSections:
  - id: "summary"
    title: "Paper Summary"
    required: true
    description: "Summarize the paper's main contributions and claims."
    maxLength: 3000

  - id: "strengths"
    title: "Strengths"
    required: true
    description: "Describe the strengths of the paper. Consider originality, quality of analysis, experimental thoroughness, clarity, and relevance to the NLP community."
    maxLength: 5000

  - id: "weaknesses"
    title: "Weaknesses"
    required: true
    description: "Describe the weaknesses of the paper. Be constructive and specific."
    maxLength: 5000

  - id: "questions"
    title: "Questions and Suggestions"
    required: true
    description: "Questions for the authors and specific suggestions for improvement."
    maxLength: 3000

  - id: "limitations"
    title: "Limitations"
    required: true
    description: "Did the authors adequately discuss limitations of their approach?"
    maxLength: 2000

  - id: "ethical_concerns"
    title: "Ethical Concerns"
    required: false
    description: "Flag any ethical issues including data privacy, potential for misuse, or bias in models/datasets."
    maxLength: 2000

  - id: "soundness"
    title: "Soundness"
    required: true
    description: "Rate the soundness of the technical approach and claims from 1 to 5."

  - id: "confidence"
    title: "Confidence"
    required: true
    description: "Rate your confidence in this review from 1 (not confident) to 5 (expert)."

precheckRules:
  - id: "page_limit"
    type: "hard_stop"
    condition: "Long paper body exceeds 8 pages or short paper body exceeds 4 pages (excluding references and appendix)"
    message: "EMNLP long papers: 8 pages max; short papers: 4 pages max. Unlimited additional pages for references and appendices."

  - id: "anonymization"
    type: "hard_stop"
    condition: "Paper is not properly anonymized for double-blind review"
    message: "EMNLP uses double-blind review. The paper must not reveal author identities."

  - id: "formatting"
    type: "needs_confirmation"
    condition: "Paper does not use the official ACL/EMNLP LaTeX template"
    message: "Papers must follow EMNLP 2026 formatting guidelines (ACL style)."

  - id: "responsible_nlp"
    type: "needs_confirmation"
    condition: "Paper does not address responsible NLP research considerations"
    message: "EMNLP requires authors to consider the responsible NLP research checklist."

  - id: "dual_submission"
    type: "hard_stop"
    condition: "Paper is submitted to another *ACL venue simultaneously"
    message: "EMNLP does not allow dual submissions to other ACL-affiliated venues."

calibration:
  status: "rubric_only"

source:
  url: "https://2026.emnlp.org/calls/main_conference_papers/"
  accessDate: "2026-01-15"
  maintainerNote: "Based on EMNLP 2024/2025 review guidelines (ARR-based). Uses 1-5 scale with half-point increments."
