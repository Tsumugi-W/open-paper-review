id: "icml/main/2026/v1"
conferenceId: "icml"
track: "main"
year: 2026
version: 1
status: "rubric_only"

scoreScale:
  min: 1
  max: 10
  step: 1
  labels:
    1: "Trivial or wrong"
    3: "Clear reject"
    5: "Marginally below acceptance threshold"
    6: "Marginally above acceptance threshold"
    8: "Clear accept"
    10: "Outstanding paper"

reviewSections:
  - id: "summary"
    title: "Summary"
    required: true
    description: "Summarize the paper and its main contributions in 3-5 sentences."
    maxLength: 3000

  - id: "strengths"
    title: "Strengths"
    required: true
    description: "Describe the strengths of the paper in terms of originality, significance, quality, and clarity."
    maxLength: 5000

  - id: "weaknesses"
    title: "Weaknesses"
    required: true
    description: "Describe the weaknesses of the paper. Be specific and constructive."
    maxLength: 5000

  - id: "questions"
    title: "Questions and Suggestions"
    required: true
    description: "List questions for the authors and suggestions for improvement."
    maxLength: 3000

  - id: "limitations"
    title: "Limitations and Societal Impact"
    required: true
    description: "Did the authors adequately address limitations and potential negative societal impact?"
    maxLength: 2000

  - id: "soundness"
    title: "Soundness"
    required: true
    description: "Rate the technical soundness on a scale from 1 (poor) to 4 (excellent)."

  - id: "presentation"
    title: "Presentation"
    required: true
    description: "Rate the clarity of presentation from 1 (poor) to 4 (excellent)."

  - id: "contribution"
    title: "Contribution"
    required: true
    description: "Rate the significance and novelty from 1 (poor) to 4 (excellent)."

  - id: "confidence"
    title: "Confidence"
    required: true
    description: "Rate your confidence in this review from 1 (low) to 5 (high/expert)."

  - id: "reproducibility"
    title: "Reproducibility"
    required: true
    description: "Can the results be reproduced based on the information given? Rate from 1 (not at all) to 5 (fully reproducible)."

precheckRules:
  - id: "page_limit"
    type: "hard_stop"
    condition: "Paper body exceeds 8 pages (excluding references and appendix)"
    message: "ICML main track papers must be at most 8 pages for the main body, with unlimited additional pages for references and appendix."

  - id: "anonymization"
    type: "hard_stop"
    condition: "Paper is not properly anonymized for double-blind review"
    message: "ICML uses double-blind review. The paper must not reveal author identities."

  - id: "formatting"
    type: "needs_confirmation"
    condition: "Paper does not use the official ICML LaTeX template"
    message: "Papers should use the official ICML 2026 LaTeX style file."

  - id: "dual_submission"
    type: "hard_stop"
    condition: "Paper appears to be a dual submission or previously published"
    message: "ICML does not accept dual submissions or previously published work."

  - id: "code_availability"
    type: "needs_confirmation"
    condition: "Paper makes empirical claims without providing code or data availability statement"
    message: "ICML strongly encourages code and data submission for reproducibility."

calibration:
  status: "rubric_only"

source:
  url: "https://icml.cc/Conferences/2026/CallForPapers"
  accessDate: "2026-01-15"
  maintainerNote: "Based on ICML 2024/2025 review guidelines. 8-page limit is strict."
