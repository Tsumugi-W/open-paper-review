services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opr
      POSTGRES_USER: opr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opr_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opr"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://opr:${POSTGRES_PASSWORD:-opr_dev_secret}@postgres:5432/opr
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data/storage
      NODE_ENV: production
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://opr:${POSTGRES_PASSWORD:-opr_dev_secret}@postgres:5432/opr
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data/storage
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      NODE_ENV: production
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
